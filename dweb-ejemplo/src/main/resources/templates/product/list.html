```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: siteHead}"></head>

<body>

<style>
    /* ===== Página de productos ===== */

    .products-page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
    }

    .products-header {
        margin-bottom: 2rem;
    }

    .products-header h1 {
        margin-bottom: .4rem;
    }

    .products-header p {
        color: #667085;
        margin: 0;
    }


    /* ===== Grid ===== */

    .products-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1.5rem;
    }


    /* ===== Tarjeta ===== */

    .product-card {
        position: relative;
        overflow: hidden;
        background: #ffffff;
        border: 1px solid #e4e7ec;
        border-radius: 14px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, .06);
    }

    .product-card__content {
        padding: 1.25rem;
    }


    /* ===== EJERCICIO 5: banda de precio ===== */

    .price-band {
        height: 14px;
        background: #d0d5dd;
    }

    .price-band--cheap {
        background: #22c55e;
    }

    .price-band--medium {
        background: #f59e0b;
    }

    .price-band--expensive {
        background: #ef4444;
    }


    /* ===== Cabecera de la tarjeta ===== */

    .product-name {
        margin: 0;
        font-size: 1.25rem;
    }

    .product-name-type {
        display: block;
        margin-top: .25rem;
        color: #667085;
        font-size: .85rem;
    }

    .product-price {
        margin: 1rem 0;
        font-size: 1.8rem;
        font-weight: 700;
    }

    .price-type {
        display: inline-block;
        margin-left: .4rem;
        padding: .2rem .5rem;
        border-radius: 5px;
        background: #f2f4f7;
        color: #475467;
        font-size: .75rem;
        vertical-align: middle;
    }


    /* ===== Datos calculados ===== */

    .product-calculations {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: .75rem;
        margin: 1rem 0 1.25rem;
    }

    .calculation {
        padding: .8rem;
        background: #f8fafc;
        border-radius: 8px;
    }

    .calculation__label {
        display: block;
        margin-bottom: .3rem;
        color: #667085;
        font-size: .75rem;
        text-transform: uppercase;
    }

    .calculation__value {
        font-weight: 600;
    }


    /* ===== Comentarios ===== */

    .comments-box {
        margin-top: 1rem;
        padding: 1rem;
        background: #f8fafc;
        border-radius: 10px;
    }

    .comments-box__header {
        display: flex;
        align-items: center;
        gap: .5rem;
        margin-bottom: .6rem;
    }

    .comments-box__icon {
        width: 24px;
        height: 24px;
        object-fit: contain;
    }

    .comments-box__status {
        font-weight: 600;
    }

    .comments-box__count {
        margin-left: auto;
        color: #667085;
        font-size: .8rem;
    }

    .comments-list {
        margin: .75rem 0 0;
        padding-left: 1.25rem;
        color: #475467;
        font-size: .9rem;
    }

    .comments-list li {
        margin-bottom: .3rem;
    }


    /* ===== Pie ===== */

    .product-card__footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: .75rem;
        margin-top: 1.25rem;
        padding-top: 1rem;
        border-top: 1px solid #e4e7ec;
    }

    .position {
        color: #667085;
        font-size: .85rem;
    }

    .recommendation--yes,
    .recommendation--no {
        display: inline-block;
        padding: .3rem .65rem;
        border-radius: 999px;
        font-size: .75rem;
        font-weight: 600;
    }

    .recommendation--yes {
        color: #166534;
        background: #dcfce7;
    }

    .recommendation--no {
        color: #475467;
        background: #f2f4f7;
    }


    /* ===== Responsive ===== */

    @media (max-width: 900px) {
        .products-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 600px) {
        .products-grid {
            grid-template-columns: 1fr;
        }
    }
</style>


<header class="site-header">
    <div class="site-header__inner">
        <a class="brand" href="home.html" th:href="@{/}">
            <img src="../static/images/happyPackLogo.png" alt="Happy Pack" th:src="@{/images/happyPackLogo.png}" />
            <span class="brand__text">
            <span class="brand__name">Happy Pack</span>
            <span class="brand__tagline">Regalos útiles para cada ocasión</span>
          </span>
        </a>
        <nav class="main-nav" aria-label="Navegación principal">
            <a href="product/list.html" th:href="@{/product/list}">Productos</a>
        </nav>
    </div>
</header>


<main class="products-page">
    <header class="products-header">
        <h1>Catálogo de productos</h1>
        <p>Consulta nuestros productos, precios y opiniones.</p>
    </header>
    <section class="products-grid">
        <article class="product-card" th:each="prod, iterStat : ${prods}">

            <!-- EJERCICIO 5.5 -->
            <div class="price-band" th:class="${prod.price < 2} ? 'price-band price-band--cheap' :
                                (${prod.price <= 5} ? 'price-band price-band--medium' : 'price-band price-band--expensive')"></div>

            <div class="product-card__content">
                <!-- Nombre del producto -->
                <header>
                    <h2 class="product-name" th:text="${prod.name}">Nombre del producto</h2>
                    <!-- EJERCICIO 5.2 -->
                    <span class="product-name-type" th:text="${#strings.length(prod.name) > 20} ? 'Nombre largo' : 'Nombre corto'">Longitud del nombre</span>
                </header>

                <!-- Precio -->
                <div class="product-price">
                    <span th:text="${#numbers.formatDecimal(prod.price, 1, 2)} + ' €'">2,50 €</span>

                    <!-- EJERCICIO 5.1 -->
                    <span class="price-type" th:text="${prod.price % 1 == 0} ? 'Precio exacto' : 'Con céntimos'">Tipo de precio</span>
                </div>

                <!-- Cálculos -->
                <section class="product-calculations">
                    <div class="calculation">
                        <span class="calculation__label">Caja de 6</span>

                        <!-- EJERCICIO 5.3 -->
                        <span class="calculation__value" th:text="${#numbers.formatDecimal(prod.price * 6, 1, 2)} + ' €'">-- € </span>
                    </div>

                    <div class="calculation">
                        <span class="calculation__label">Precio / ID</span>

                        <!-- EJERCICIO 5.4 -->
                        <span class="calculation__value" th:text="${prod.price > prod.id} ? 'Precio superior' : 'Precio igual o inferior'">Resultado</span>
                    </div>
                </section>

                <!-- Comentarios -->
                <section class="comments-box">
                    <div class="comments-box__header">
                        <!-- EJERCICIO 5.7 -->
                        <img class="comments-box__icon"
                             src="https://cdn-icons-png.flaticon.com/512/1380/1380338.png"
                             th:src="${#lists.isEmpty(prod.comments)} ?
                 @{https://static.vecteezy.com/system/resources/thumbnails/054/398/057/small_2x/no-comment-icon-isolated-on-white-background-no-chat-icon-illustration-vector.jpg} :
                 @{https://cdn-icons-png.flaticon.com/512/1380/1380338.png}"
                             alt="Comentarios">

                        <!-- EJERCICIO 5.6 -->
                        <span class="comments-box__status" th:text="${#lists.isEmpty(prod.comments)} ? 'Sin comentarios' : 'Con comentarios'">
                            Número de comentarios
                        </span>

                    </div>
                </section>

                <!-- Pie de la tarjeta -->
                <footer class="product-card__footer">

                    <!-- EJERCICIO 5.8 -->
                    <span class="position" th:text="${iterStat.count % 2 == 0} ? 'Posición par' : 'Posición impar'">
                        Posición
                    </span>

                    <!-- EJERCICIO 5.9 -->
                    <span class="recommendation--no" th:class="${prod.inStock and prod.price <= 5} ?
                    'recommendation--yes' :
                    'recommendation--no'">
                        Recomendado
                    </span>
                </footer>
            </div>
        </article>

    </section>

</main>


<footer class="site-footer">
    <div class="site-footer__inner">
        <span>&copy; 2026 Happy Pack</span>
    </div>
</footer>

</body>
</html>
